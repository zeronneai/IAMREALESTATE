<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Make a payment · I AM Real Estate</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    :root { --gold: #d4a843; --bg: #0b0b0b; --card: #151515; --line: rgba(212,168,67,.45); --muted: #a9a294; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: #f3efe6; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; align-items: flex-start; justify-content: center; padding: 58px 16px 28px; }
    .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .logo { display: block; height: 46px; margin: 0 auto 18px; }
    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    .sub { color: var(--muted); text-align: center; margin: 0 0 20px; font-size: 14px; }
    .amt { font-size: 40px; font-weight: 700; text-align: center; color: var(--gold); margin: 6px 0 2px; letter-spacing: -.5px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.07); font-size: 14.5px; }
    .row span:first-child { color: var(--muted); }
    .row span:last-child { text-align: right; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: #0f0f0f; color: #fff; font-size: 15px; }
    button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px; background: var(--gold); color: #111; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .note { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 14px; }
    .ok { text-align: center; }
    .ok .big { font-size: 46px; }
    .lang { position: fixed; top: 12px; right: 14px; background: none; border: 1px solid var(--line); color: var(--gold); width: auto; padding: 6px 10px; margin: 0; font-size: 13px; border-radius: 8px; }
    .err { color: #ff8a7a; text-align: center; }
  </style>
</head>
<body>
  <button class="lang" id="lang" type="button">Español</button>
  <main class="card" id="app"><img class="logo" src="/img/iam-logo.png" alt="I AM Real Estate" /><p class="sub" id="loading">Loading…</p></main>
  <script>
    const T = {
      en: { title: 'Make a payment', due: 'Amount due', for: 'For', home: 'Home', month: 'Month', dueOn: 'Due date', email: 'Email for your receipt (optional)', pay: 'Pay securely', paying: 'Opening secure payment…', note: 'Card or bank account (ACH). Payments are processed securely by Stripe. Bank payments take 3 to 5 business days to clear.', none: 'You are all caught up. There is nothing due right now.', thanks: 'Thank you! Your payment was received.', thanksNote: 'You will get a receipt by email. Card payments post right away; bank payments when they clear.', bad: 'This payment link is not valid. Please contact us.', soon: 'Online payments are not active yet. Please contact us to pay.', fail: 'We could not open the payment page. Please try again.', hi: 'Hi', call: 'Questions? Text or call' },
      es: { title: 'Hacer un pago', due: 'Monto a pagar', for: 'Concepto', home: 'Casa', month: 'Mes', dueOn: 'Fecha límite', email: 'Correo para tu recibo (opcional)', pay: 'Pagar de forma segura', paying: 'Abriendo el pago seguro…', note: 'Tarjeta o cuenta bancaria (ACH). Los pagos se procesan de forma segura con Stripe. Los pagos bancarios tardan de 3 a 5 días hábiles en reflejarse.', none: 'Estás al corriente. No hay nada pendiente por ahora.', thanks: '¡Gracias! Recibimos tu pago.', thanksNote: 'Te llegará un recibo por correo. Los pagos con tarjeta se registran de inmediato; los bancarios cuando se reflejan.', bad: 'Este link de pago no es válido. Por favor contáctanos.', soon: 'Los pagos en línea todavía no están activos. Contáctanos para pagar.', fail: 'No pudimos abrir la página de pago. Intenta de nuevo.', hi: 'Hola', call: '¿Dudas? Mándanos texto o llama al' },
    }
    const q = new URLSearchParams(location.search), token = q.get('t') || ''
    let lang = (q.get('lang') || navigator.language || 'en').toLowerCase().startsWith('es') ? 'es' : 'en', info = null, err = null
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : ''
    const fmtMonth = d => d ? new Date(d + 'T12:00:00').toLocaleDateString(lang === 'es' ? 'es-MX' : 'en-US', { month: 'long', year: 'numeric' }) : ''
    const phone = p => { const d = String(p || '').replace(/\D/g, '').slice(-10); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : '' }
    const app = document.getElementById('app')
    function paint() {
      const L = T[lang]
      document.getElementById('lang').textContent = lang === 'es' ? 'English' : 'Español'
      document.documentElement.lang = lang
      const logo = '<img class="logo" src="/img/iam-logo.png" alt="I AM Real Estate" />'
      const contact = info?.phone ? `<p class="note">${esc(L.call)} ${esc(phone(info.phone))}</p>` : ''
      if (err) { app.innerHTML = logo + `<p class="err">${esc(L[err] || L.bad)}</p>`; return }
      if (!info) return
      if (q.get('ok') === '1') { app.innerHTML = logo + `<div class="ok"><div class="big">✅</div><h1>${esc(L.thanks)}</h1><p class="sub">${esc(L.thanksNote)}</p></div>` + contact; return }
      const what = info.label || info.kind_label[lang === 'es' ? 1 : 0]
      if (!info.period || !(info.amount > 0)) { app.innerHTML = logo + `<h1>${esc(info.name ? L.hi + ' ' + info.name : L.title)}</h1><p class="sub">${esc(L.none)}</p>` + contact; return }
      app.innerHTML = logo + `<h1>${esc(info.name ? L.hi + ' ' + info.name + ',' : L.title)}</h1><p class="sub">${esc(info.company)}</p>
        <p class="sub" style="margin:0">${esc(L.due)}</p><div class="amt">${esc(money(info.amount))}</div>
        <div style="margin-top:14px"><div class="row"><span>${esc(L.for)}</span><span>${esc(what)}</span></div>
        ${info.home ? `<div class="row"><span>${esc(L.home)}</span><span>${esc(info.home)}${info.unit ? ' #' + esc(info.unit) : ''}</span></div>` : ''}
        <div class="row"><span>${esc(L.month)}</span><span>${esc(fmtMonth(info.period))}</span></div>
        ${info.due ? `<div class="row"><span>${esc(L.dueOn)}</span><span>${esc(fmtDate(info.due))}</span></div>` : ''}</div>
        ${info.ready ? `<label for="em">${esc(L.email)}</label><input id="em" type="email" autocomplete="email" inputmode="email" />
        <button id="go" type="button">${esc(L.pay)} · ${esc(money(info.amount))}</button><p class="note">${esc(L.note)}</p>` : `<p class="err" style="margin-top:18px">${esc(L.soon)}</p>`}` + contact
      const go = document.getElementById('go')
      if (go) go.onclick = async () => {
        go.disabled = true; go.textContent = L.paying
        try {
          const r = await fetch('/api/pay/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, email: document.getElementById('em').value.trim() }) })
          const j = await r.json()
          if (j.url) { location.href = j.url; return }
          throw new Error(j.error || 'fail')
        } catch { go.disabled = false; go.textContent = `${L.pay} · ${money(info.amount)}`; alert(L.fail) }
      }
    }
    document.getElementById('lang').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; paint() }
    if (!token) { err = 'bad'; paint() }
    else fetch('/api/pay/info?t=' + encodeURIComponent(token)).then(r => r.ok ? r.json() : Promise.reject()).then(j => { info = j; paint() }).catch(() => { err = 'bad'; paint() })
  </script>
</body>
</html>
